<title>Pixel-Perfect Floor Plan (Aligned)</title>

<style>
:root {
  /* === MEASURED FROM PNG === */
  --booth-w: 14px;
  --booth-h: 22px;
  --gap-x: 6px;
  --gap-y: 6px;

  --green: #B6FCD5;
  --yellow: #F5FCB6;
  --blue: #B6E8FC;
}

/* Page */
body {
  margin: 0;
  background: #ccc;
  font-family: Arial, sans-serif;
}

/* === Viewport === */
.viewport {
  width: 1080px;
  height: 1940px;
  margin: 0 auto;
  overflow: hidden;
  background: #ccc;
}


/* === CANVAS = EXACT PNG SIZE === */
.canvas {
  position: relative;
  width: 1080px;
  height: 1920px;
  background: #fff;
  overflow: hidden;
}

/* Overlay (true 1:1) */
.canvas.overlay {
  background: url(floorplan_1080.png) no-repeat top left;
}

/* Booths */
.booth {
  position: absolute;
  width: var(--booth-w);
  height: var(--booth-h);
  background: var(--green);
  border: 1px solid #555;
  font-size: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background-color 0.15s ease, box-shadow 0.15s ease;
  overflow: hidden;
}

.booth.yellow {
  background: var(--yellow);
  --booth-w: 15px;
  --booth-h: 42px;
  
}
.booth.blue{
    background: var(--blue);
    --booth-w: 4px;
    --booth-h: 15px;
    
}
/* Hover = slightly darker shade (same color family) */
.booth:hover {
  filter: brightness(0.92);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15);
}

/* When image is active */
.booth.has-logo {
  padding: 0;
  background: #fff; /* fallback behind transparent logos */
}

/* Logo image inside booth */
.booth img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none; /* click still belongs to booth */
}
/* ===== Large logo display (5x booth size) ===== */
.booth-logo-large {
  position: absolute;
  z-index: 1000;
  pointer-events: none;
  background: white;
  border: 1px solid rgba(0,0,0,0.2);
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  padding: 6px;
}

.booth-logo-large img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}


/* Major structures */
.ballroom {
  position: absolute;
  border: 2px solid #000;
}

.room {
  position: absolute;
  border: 2px solid #000;
}

.room span {
  position: absolute;
  top: 6px;
  right: 8px;
  font-weight: bold;
}

.location-marker {
  width: 15px;
  height: 15px;
  background-color: #337ab7;
  border-radius: 50% 50% 50% 0;
  transform: rotate(45deg);
  margin: 20px;
  position: relative;
}
.location-marker:after {
  content: '';
  width: 5px;
  height: 5px;
  background-color: white;
  position: absolute;
  border-radius: 50%;
  top: 5px;
  left: 5px;
}

/* === Vendor Bar Overlay (Bottom) === */
#vendor-bar {
  position: absolute;
  left: -4px;
  bottom: 1721px;

  width: 633px;
  height: 200px; /* enough for 10 vendors */

  background: rgba(248, 249, 250, 0.96);
  border-top: 2px solid #ccc;
  z-index: 2500;

  display: flex;
  flex-direction: column;
   backdrop-filter: blur(2px);
}

/* Header stays fixed */
.vendor-header {
  padding: 6px 10px;
  font-weight: bold;
  font-size: 14px;
  border-bottom: 1px solid #ddd;
  background: #f8f9fa;
}

/* Scroll area only */
#vendor-scroll {
  flex: 1;
  overflow-y: auto;
}

/* Vendor rows */
.vendor-item {
  min-height: 36px; /* 10 items visible */
  font-size: 14px;
  cursor: pointer;
}

.vendor-item.active {
  background-color: #dbeafe;
  border-left: 4px solid #0d6efd;
}

</style>

/* Click handler */
let activeBooth = null;

function resetBooth(booth) {
  if (!booth) return;

  booth.classList.remove("has-logo");
  booth.innerHTML = booth._originalHTML;

  if (booth._largeLogo) {
    booth._largeLogo.remove();
    booth._largeLogo = null;
  }
}
/* 🔑 SINGLE TOGGLE FUNCTION
   Used by BOTH booth clicks and vendor clicks */
function toggleBoothById(boothId) {
  const booth = [...document.querySelectorAll(".booth")]
    .find(b => b.textContent.trim() === boothId);  

  if (activeBooth && activeBooth !== booth) {
    resetBooth(activeBooth);
  }
  if (!booth) return;

  if (booth.classList.contains("has-logo")) {
    resetBooth(booth);
    activeBooth = null;
    syncVendorHighlight(null);
    return;
  }

  booth.classList.add("has-logo");
  booth.innerHTML = "";

  const logoUrl = boothLogos[boothId] || DEFAULT_LOGO;

  const smallImg = document.createElement("img");
  smallImg.src = logoUrl;
  booth.appendChild(smallImg);

  const rect = booth.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();

  const largeLogo = document.createElement("div");
  largeLogo.className = "booth-logo-large";

  const largeW = rect.width * 5;
  const largeH = rect.height * 5;

  largeLogo.style.width = largeW + "px";
  largeLogo.style.height = largeH + "px";

  let left = rect.right - canvasRect.left + 12;
  let top  = rect.top - canvasRect.top;

  if (left + largeW > canvasRect.width) {
    left = rect.left - canvasRect.left - largeW - 12;
  }

  largeLogo.style.left = left + "px";
  largeLogo.style.top  = top + "px";

  const largeImg = document.createElement("img");
  largeImg.src = logoUrl;
  largeLogo.appendChild(largeImg);
  canvas.appendChild(largeLogo);

  booth._largeLogo = largeLogo;
  activeBooth = booth;
  syncVendorHighlight(boothId);
}

/* === Booth click now routes through toggle === */
document.querySelectorAll(".booth").forEach(booth => {
  booth._originalHTML = booth.innerHTML;
  booth.addEventListener("click", () => {
    toggleBoothById(booth.textContent.trim());
  });
});

/* === Sync vendor highlight === */
function syncVendorHighlight(boothId) {
  document.querySelectorAll(".vendor-item").forEach(item => {
    item.classList.toggle(
      "active",
      boothId && item.dataset.booth === boothId
    );
  });
}

        );

let focusedIndex = 0;

document
  .getElementById("vendor-list")
  .addEventListener("keydown", e => {
    const visibleItems = vendorItems.filter(
      i => i.style.display !== "none"
    );

    if (!visibleItems.length) return;

    if (e.key === "ArrowDown") {
      focusedIndex = Math.min(
        focusedIndex + 1,
        visibleItems.length - 1
      );
      visibleItems[focusedIndex].focus();
      e.preventDefault();
    }

    if (e.key === "ArrowUp") {
      focusedIndex = Math.max(focusedIndex - 1, 0);
      visibleItems[focusedIndex].focus();
      e.preventDefault();
    }

    if (e.key === "Enter") {
      visibleItems[focusedIndex].click();
    }
  });
